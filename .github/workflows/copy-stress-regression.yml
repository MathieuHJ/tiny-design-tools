name: Copy Stress browser regression

on:
  pull_request:
    paths:
      - 'tools/copy-stress/**'
      - 'public/copy-stress/**'
      - 'scripts/test-copy-stress-*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/copy-stress-regression.yml'

permissions:
  contents: read

concurrency:
  group: copy-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Run runtime regression and baseline comparison
        run: COMPARE_BASELINE=1 pnpm test:copy-stress-runtime
